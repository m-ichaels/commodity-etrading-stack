[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cetk"
version = "0.1.0"
description = "Commodity swap e-trading stack: numpy reference of the curve engine, loaders and results"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "fpdf2", "xlrd"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["cetk"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
